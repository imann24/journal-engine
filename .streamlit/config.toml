# Streamlit config. The bind address/port are passed on the command line by
# run_web.sh (from JOURNAL_WEB_HOST / JOURNAL_WEB_PORT) so they stay env-driven.

[browser]
# No telemetry, ever. This is the most personal data the user owns.
gatherUsageStats = false

[theme.light]
# Blue accent while preserving Streamlit's switchable light mode.
primaryColor = "#2563eb"

[theme.dark]
# Slightly brighter blue for contrast in dark mode.
primaryColor = "#60a5fa"

[server]
headless = true
# Bind is set via CLI flags in run_web.sh; these are safe fallbacks.
address = "0.0.0.0"
port = 8501
# Keep XSRF protection on (the auth cookie flow relies on it). Leave CORS at its
# default — disabling it conflicts with XSRF protection.
enableXsrfProtection = true
